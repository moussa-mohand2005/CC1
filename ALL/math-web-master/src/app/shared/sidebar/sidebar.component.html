<aside class="fixed top-16 left-0 w-64 h-[calc(100vh-4rem)] bg-gradient-to-b from-blue-300 via-blue-500 to-blue-300 text-blue-900 shadow-md z-40">
    <div class="p-4">
      <h2 class="text-lg font-semibold mb-4 text-blue-800">User Menu</h2>
  
      <div id="teacher-sidebar" class="space-y-2">
        <button
          (click)="select('teacher-home')"
          [class]="'section-btn flex items-center w-full px-4 py-2 text-left text-sm font-medium rounded-md transition ' +
            (selectedSection === 'teacher-home'
              ? 'bg-white text-blue-900 shadow'
              : 'hover:bg-blue-100 hover:text-blue-800')"
        >
          <svg class="mr-3 h-5 w-5 text-blue-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Home
        </button>
  
        <button
          (click)="select('student-register')"
          [class]="'section-btn flex items-center w-full px-4 py-2 text-left text-sm font-medium rounded-md transition ' +
            (selectedSection === 'student-register'
              ? 'bg-white text-blue-900 shadow'
              : 'hover:bg-blue-100 hover:text-blue-800')"
        >
          <svg class="mr-3 h-5 w-5 text-blue-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
          </svg>
          Register Student
        </button>
  
        <button
          (click)="select('student-list')"
          [class]="'section-btn flex items-center w-full px-4 py-2 text-left text-sm font-medium rounded-md transition ' +
            (selectedSection === 'student-list'
              ? 'bg-white text-blue-900 shadow'
              : 'hover:bg-blue-100 hover:text-blue-800')"
        >
          <svg class="mr-3 h-5 w-5 text-blue-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          Student List
        </button>
  
        <button
          (click)="select('test-create')"
          [class]="'section-btn flex items-center w-full px-4 py-2 text-left text-sm font-medium rounded-md transition ' +
            (selectedSection === 'test-create'
              ? 'bg-white text-blue-900 shadow'
              : 'hover:bg-blue-100 hover:text-blue-800')"
        >
          <svg class="mr-3 h-5 w-5 text-blue-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
          Create Game
        </button>
        
  
        <button
          (click)="select('test-list')"
          [class]="'section-btn flex items-center w-full px-4 py-2 text-left text-sm font-medium rounded-md transition ' +
            (selectedSection === 'test-list'
              ? 'bg-white text-blue-900 shadow'
              : 'hover:bg-blue-100 hover:text-blue-800')"
        >
          <svg class="mr-3 h-5 w-5 text-blue-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          Game List
        </button>


        <button
        (click)="select('parent-list')"
        [class]="'section-btn flex items-center w-full px-4 py-2 text-left text-sm font-medium rounded-md transition ' +
          (selectedSection === 'parent-list'
            ? 'bg-white text-blue-900 shadow'
            : 'hover:bg-blue-100 hover:text-blue-800')"
      >
        <svg class="mr-3 h-5 w-5 text-blue-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 20v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 11h-6M20 8v6" />
        </svg>
        Parent List
      </button>
      
      </div>
    </div>
  </aside>
