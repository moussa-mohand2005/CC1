<div class="min-h-screen bg-gradient-to-b from-blue-100 via-blue-200 to-blue-300 px-4 py-10">
  <div class="max-w-8xl mx-auto bg-white rounded-3xl shadow-xl border border-blue-200 p-6">
    <h2 class="text-center text-3xl font-bold text-blue-800 mb-8 tracking-wide">Student List</h2>

    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
      <div class="flex items-center border border-blue-300 rounded-md bg-white px-3 py-2 shadow-sm w-full md:w-1/2">
        <svg class="w-5 h-5 text-blue-500 mr-2" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M21 21l-4.35-4.35M16.65 16.65A7.5 7.5 0 104.5 4.5a7.5 7.5 0 0012.15 12.15z"></path>
        </svg>
        <input [(ngModel)]="searchQuery" type="text" placeholder="Search by name..."
               class="w-full focus:outline-none text-gray-700 placeholder-gray-400" />
      </div>

      <div class="relative mb-4">
        <select [(ngModel)]="selectedGroup"
                class="px-4 py-2 border border-blue-300 rounded-md bg-white text-gray-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="">All Groups</option>
          <option *ngFor="let group of groupList" [value]="group">{{ group }}</option>
        </select>
      </div>
    </div>

    <div *ngIf="loading" class="text-center text-blue-600">Loading students...</div>
    <div *ngIf="!loading && filteredStudents.length === 0" class="text-center text-gray-600">No students found.</div>

    <div *ngIf="!loading && filteredStudents.length > 0" class="overflow-x-auto">
      <table class="min-w-full table-auto border-collapse rounded-md overflow-hidden">
        <thead>
          <tr class="bg-blue-100 text-blue-800 text-left text-sm">
            <th class="p-3">First Name</th>
            <th class="p-3">Last Name</th>
            <th class="p-3">Birth Date</th>
            <th class="p-3">Grade</th>
            <th class="p-3">Gender</th>
            <th class="p-3">QR Code</th>
            <th class="p-3 text-center">Scans</th>
            <th class="p-3 text-center">View</th>
            <th class="p-3 text-center">Edit</th>
            <th class="p-3 text-center">Delete</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let student of filteredStudents" class="hover:bg-blue-50 border-b">
            <td class="p-3">{{ student.firstName }}</td>
            <td class="p-3">{{ student.lastName }}</td>
            <td class="p-3">{{ student.birthday || 'N/A' }}</td>
            <td class="p-3">{{ student.schoolGrade }}</td>
            <td class="p-3">{{ student.gender }}</td>
            <td class="p-3">
              <img [src]="student.qrCode" alt="QR" class="w-14 h-14 cursor-pointer border rounded" (click)="showQr(student.qrCode)" />
            </td>
            <td class="p-3 text-center font-semibold text-blue-700">{{ student.qrScans || 0 }}</td>
            <td class="p-3 text-center">
              <button (click)="viewStudent(student.uid)" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 text-sm rounded-full">
                👁
              </button>
            </td>
            <td class="p-3 text-center">
              <button (click)="editStudent(student.uid)" class="bg-orange-500 hover:bg-orange-600 text-white px-3 py-1 text-sm rounded-full">
                ✏️
              </button>
            </td>
            <td class="p-3 text-center">
              <button (click)="unlinkStudent(student.uid)" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 text-sm rounded-full">
                🗑
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="qrPreview" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
      <div class="bg-white p-6 rounded-xl shadow-lg relative">
        <img [src]="qrPreview" alt="QR Code" class="w-80 h-80" />
        <button (click)="qrPreview = null" class="absolute top-2 right-2 text-red-600 text-2xl font-bold hover:text-red-800">×</button>
      </div>
    </div>
  </div>
</div>
