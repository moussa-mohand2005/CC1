<div class="min-h-screen bg-gradient-to-b from-blue-100 via-blue-200 to-blue-300 px-6 py-12">
  <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-2xl p-8 border border-blue-200">
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-2xl font-bold text-blue-800 tracking-wider">Test List</h2>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <label class="text-blue-900 font-medium">Grade:</label>
          <select [(ngModel)]="selectedGrade" (change)="applyFilter()"
            class="px-4 py-2 bg-blue-50 border border-blue-300 rounded-md text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-400">
            <option value="">All grades</option>
            <option *ngFor="let grade of grades" [value]="grade">Grade {{ grade }}</option>
          </select>
        </div>
        <a routerLink="/tests/create"
          class="px-5 py-2 bg-gradient-to-r from-blue-400 to-blue-600 text-white rounded-full font-semibold shadow hover:from-blue-500 hover:to-blue-700 transition">
          + Add Test
        </a>
      </div>
    </div>

    <div *ngIf="error" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-md text-center">
      {{ error }}
    </div>

    <div *ngIf="success" class="mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-md text-center">
      {{ success }}
    </div>

    <div *ngIf="loading" class="flex justify-center items-center py-12">
      <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent"></div>
    </div>

    <div *ngIf="!loading" class="overflow-x-auto">
      <table class="min-w-full table-auto bg-white rounded-lg overflow-hidden shadow-sm border border-blue-100">
        <thead class="bg-blue-100 text-blue-900 text-sm uppercase tracking-wide">
          <tr>
            <th class="px-6 py-3 text-left">Title & Description</th>
            <th class="px-6 py-3 text-center">Grade</th>
            <th class="px-6 py-3 text-center">Games</th>
            <th class="px-6 py-3 text-center">Date</th>
            <th class="px-6 py-3 text-center">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-blue-100">
          <tr *ngFor="let test of filteredTests" class="hover:bg-blue-50">
            <td class="px-6 py-4">
              <p class="font-semibold text-blue-900">{{ test.title.en }}</p>
              <p class="text-sm text-gray-600 mt-1">{{ test.description.en }}</p>
            </td>
            <td class="px-6 py-4 text-center">
              <span class="bg-blue-200 text-blue-900 px-3 py-1 rounded-full text-xs font-medium">
                Grade {{ test.class }}
              </span>
            </td>
            <td class="px-6 py-4">
              <div class="flex flex-wrap justify-center gap-1">
                <span *ngFor="let game of test.games"
                  class="bg-blue-50 text-blue-800 text-xs px-2 py-1 rounded-full border border-blue-300">
                  {{ getGameName(game) }}
                </span>
              </div>
            </td>
            <td class="px-6 py-4 text-center text-sm text-gray-600">
              {{ formatDate(test.createdAt) }}
            </td>
            <td class="px-6 py-4">
              <div class="flex justify-center gap-2">
                <button [routerLink]="['/tests', test.id, 'results']"
                  class="bg-blue-100 text-blue-800 hover:bg-blue-200 px-3 py-1 rounded-full text-xs font-semibold transition">
                  Results
                </button>
                <button [routerLink]="['/tests', test.id, 'edit']"
                  class="bg-yellow-100 text-yellow-800 hover:bg-yellow-200 px-3 py-1 rounded-full text-xs font-semibold transition">
                  Edit
                </button>
                <button (click)="deleteTest(test.id)"
                  class="bg-red-100 text-red-800 hover:bg-red-200 px-3 py-1 rounded-full text-xs font-semibold transition">
                  Delete
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <div *ngIf="filteredTests.length === 0" class="text-center py-10 text-gray-500">
        No tests available.
      </div>
    </div>
  </div>
</div>
