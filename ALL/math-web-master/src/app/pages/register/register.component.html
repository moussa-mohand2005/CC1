<div class="min-h-screen flex items-center justify-center bg-gradient-to-b from-blue-100 via-blue-200 to-blue-300 px-4">
  <div class="relative w-[600px] rounded-2xl overflow-hidden shadow-lg" style="min-height: 600px">
    <div class="bg-white px-8 pt-10 pb-32 h-full flex flex-col justify-between border border-blue-200">
      <div>
        <h2 class="text-center text-blue-800 text-xl font-bold mb-8 tracking-widest">CREATE ACCOUNT</h2>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5 text-gray-800">

          <div>
            <label class="block text-sm mb-1">First Name</label>
            <input type="text" placeholder="FIRST NAME..." formControlName="firstName"
              class="w-full px-4 py-3 rounded-md bg-blue-50 placeholder-gray-500 border border-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all" />
          </div>

          <div>
            <label class="block text-sm mb-1">Last Name</label>
            <input type="text" placeholder="LAST NAME..." formControlName="lastName"
              class="w-full px-4 py-3 rounded-md bg-blue-50 placeholder-gray-500 border border-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all" />
          </div>

          <div>
            <label class="block text-sm mb-1">Email</label>
            <input type="email" placeholder="EMAIL..." formControlName="email"
              class="w-full px-4 py-3 rounded-md bg-blue-50 placeholder-gray-500 border border-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all" />
          </div>

          <div>
            <label class="block text-sm mb-1">Password</label>
            <input type="password" placeholder="PASSWORD..." formControlName="password"
              class="w-full px-4 py-3 rounded-md bg-blue-50 placeholder-gray-500 border border-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all" />
          </div>

          <div>
            <label class="block text-sm mb-1">Role</label>
            <select formControlName="role"
              class="w-full px-4 py-3 bg-blue-50 text-gray-800 border border-blue-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all">
              <option value="" disabled selected>Select your role</option>
              <option value="Teacher">Teacher</option>
              <option value="Parent">Parent</option>
              <option value="Principal">Principal</option>
            </select>
          </div>

          <div *ngIf="errorMessage" class="text-sm text-red-600 bg-red-100 p-3 rounded-md">
            {{ errorMessage }}
          </div>

          <div class="pt-4 space-y-4">
            <button type="submit" [disabled]="loading"
              class="w-full py-3 text-lg bg-gradient-to-r from-blue-400 to-blue-600 text-white rounded-full font-bold shadow-md hover:from-blue-500 hover:to-blue-700 transition-all disabled:opacity-50">
              REGISTER
            </button>

            <div class="text-center">
              <span class="text-sm text-gray-700">Already have an account?
                <a routerLink="/login" class="text-blue-600 hover:text-blue-500 underline ml-1">Sign in</a>
              </span>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="absolute bottom-0 left-0 w-full">
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none" class="w-full h-32">
        <path fill="#60A5FA" fill-opacity="1"
          d="M0,160L40,170.7C80,181,160,203,240,192C320,181,400,139,480,128C560,117,640,139,720,138.7C800,139,880,117,960,133.3C1040,149,1120,203,1200,202.7C1280,203,1360,149,1400,122.7L1440,96L1440,320L1400,320C1360,320,1280,320,1200,320C1120,320,1040,320,960,320C880,320,800,320,720,320C640,320,560,320,480,320C400,320,320,320,240,320C160,320,80,320,40,320L0,320Z">
        </path>
      </svg>
    </div>
  </div>
</div>
