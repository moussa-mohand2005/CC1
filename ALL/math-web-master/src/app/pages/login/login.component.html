<div class="min-h-screen flex items-center justify-center bg-gradient-to-b from-blue-100 via-blue-200 to-blue-300 px-4">
  <div class="relative w-[400px] rounded-2xl overflow-hidden shadow-lg" style="min-height: 540px">
    <div class="bg-white px-8 pt-10 pb-28 h-full flex flex-col justify-between border border-blue-200">
      <div>
        <h2 class="text-center text-blue-800 text-xl font-bold mb-8 tracking-widest">WELCOME BACK</h2>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <input type="email" placeholder="you@example.com" formControlName="email"
            class="w-full px-4 py-3 text-base rounded-md bg-blue-50 text-gray-800 placeholder-gray-500 border border-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all" />

          <input type="password" placeholder="••••••••" formControlName="password"
            class="w-full px-4 py-3 text-base rounded-md bg-blue-50 text-gray-800 placeholder-gray-500 border border-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all" />

          <div class="flex items-center justify-between text-sm text-gray-700">
            <a (click)="resetPassword()" class="text-blue-600 hover:text-blue-500 cursor-pointer transition-colors">
              Forgot Password?
            </a>
          </div>

          <div *ngIf="errorMessage" class="text-sm text-red-600 bg-red-100 p-3 rounded-md">
            ⚠ {{ errorMessage }}
          </div>

          <div class="pt-6 space-y-6">
            <button type="submit" [disabled]="loading"
              class="w-full py-3 text-lg bg-gradient-to-r from-blue-400 to-blue-600 text-white rounded-full font-bold shadow-md hover:from-blue-500 hover:to-blue-700 transition-all disabled:opacity-50">
              LOGIN
            </button>

            <div class="text-center">
              <span class="text-sm text-gray-700">Don't have an account?
                <a routerLink="/register" class="text-blue-600 hover:text-blue-500 underline ml-1">Register here</a>
              </span>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="absolute bottom-0 left-0 w-full">
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none" class="w-full h-32">
        <path fill="#60A5FA" fill-opacity="1"
          d="M0,96L40,106.7C80,117,160,139,240,144C320,149,400,139,480,160C560,181,640,235,720,240C800,245,880,203,960,170.7C1040,139,1120,117,1200,112C1280,107,1360,117,1400,122.7L1440,128L1440,320L1400,320C1360,320,1280,320,1200,320C1120,320,1040,320,960,320C880,320,800,320,720,320C640,320,560,320,480,320C400,320,320,320,240,320C160,320,80,320,40,320L0,320Z" />
      </svg>
    </div>
  </div>
</div>
