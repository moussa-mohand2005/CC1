<div class="min-h-screen flex items-center justify-center bg-gradient-to-b from-blue-100 via-blue-200 to-blue-300 px-4">
  <div class="relative w-full max-w-4xl rounded-2xl overflow-hidden shadow-lg" style="min-height: 700px">
    <div class="bg-white px-10 pt-10 pb-32 h-full flex flex-col justify-between border border-blue-200">
      <div>
        <h2 class="text-center text-blue-800 text-xl font-bold mb-10 tracking-widest">PROFESSOR INFORMATION</h2>

        <form [formGroup]="enseignantForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-6 text-gray-800">
          <div>
            <label class="block mb-1 text-sm">Phone Number</label>
            <input formControlName="telephone" type="tel" placeholder="Phone Number" class="input-field text-black placeholder-black" />
            <div *ngIf="isFieldInvalid('telephone')" class="text-red-600 text-xs mt-1">{{ getFieldError('telephone') }}</div>
          </div>

          <div>
            <label class="block mb-1 text-sm">Date of Birth</label>
            <input formControlName="dateNaissance" type="date" class="input-field text-black placeholder-black" />
            <div *ngIf="isFieldInvalid('dateNaissance')" class="text-red-600 text-xs mt-1">{{ getFieldError('dateNaissance') }}</div>
          </div>

          <div>
            <label class="block mb-1 text-sm">Academy</label>
            <select formControlName="academy" (change)="onAcademyChange($event)" class="input-field text-black">
              <option value="" disabled selected>Select your Académie</option>
              <option value="Tangier-Tetouan-Al Hoceima">Tangier-Tetouan-Al Hoceima</option>
              <option value="Oriental">Oriental</option>
              <option value="Fes-Meknes">Fès-Meknès</option>
              <option value="Rabat-Sale-Kenitra">Rabat-Salé-Kénitra</option>
              <option value="Beni Mellal-Khenifra">Béni Mellal-Khénifra</option>
              <option value="Casablanca-Settat">Casablanca-Settat</option>
              <option value="Marrakech-Safi">Marrakech-Safi</option>
              <option value="Draa-Tafilalet">Drâa-Tafilalet</option>
              <option value="Souss-Massa">Souss-Massa</option>
              <option value="Guelmim-Oued Noun">Guelmim-Oued Noun</option>
              <option value="Laayoune-Sakia El Hamra">Laâyoune-Sakia El Hamra</option>
              <option value="Dakhla-Oued Ed-Dahab">Dakhla-Oued Ed-Dahab</option>
            </select>
            <div *ngIf="isFieldInvalid('academy')" class="text-red-600 text-xs mt-1">{{ getFieldError('academy') }}</div>
          </div>

          <div>
            <label class="block mb-1 text-sm">School Name</label>
            <select formControlName="ecole" class="input-field text-black" [disabled]="!schools.length">
              <option value="" disabled selected>{{ schools.length ? 'Select your School' : 'Please select an academy first' }}</option>
              <option *ngFor="let school of schools" [value]="school.name">
                {{ school.name }}
              </option>
            </select>
            <div *ngIf="isFieldInvalid('ecole')" class="text-red-600 text-xs mt-1">{{ getFieldError('ecole') }}</div>
          </div>

          <div>
            <label class="block mb-1 text-sm">Hire Date</label>
            <input formControlName="dateEmbauche" type="date" class="input-field text-black placeholder-black" />
            <div *ngIf="isFieldInvalid('dateEmbauche')" class="text-red-600 text-xs mt-1">{{ getFieldError('dateEmbauche') }}</div>
          </div>

          <div class="md:col-span-2">
            <label class="block mb-1 text-sm">Subjects Taught</label>
            <textarea formControlName="matieres_enseignees" rows="2" placeholder="Subjects taught (comma-separated)" class="input-field text-black placeholder-black w-full"></textarea>
            <div *ngIf="isFieldInvalid('matieres_enseignees')" class="text-red-600 text-xs mt-1">{{ getFieldError('matieres_enseignees') }}</div>
          </div>

          <div class="pt-6 md:col-span-2">
            <button type="submit" [disabled]="loading"
              class="w-full py-3 text-lg bg-gradient-to-r from-blue-400 to-blue-600 text-white rounded-full font-bold shadow-md hover:from-blue-500 hover:to-blue-700 transition-all">
              {{ loading ? 'SUBMITTING...' : 'SUBMIT' }}
            </button>
            <div *ngIf="errorMessage" class="text-red-600 text-center mt-2">{{ errorMessage }}</div>
          </div>
        </form>
      </div>
    </div>

    <div class="absolute bottom-0 left-0 w-full">
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none" class="w-full h-32">
        <path fill="#60A5FA" fill-opacity="1"
          d="M0,160L40,170.7C80,181,160,203,240,192C320,181,400,139,480,128C560,117,640,139,720,138.7C800,139,880,117,960,133.3C1040,149,1120,203,1200,202.7C1280,203,1360,149,1400,122.7L1440,96L1440,320L1400,320C1360,320,1280,320,1200,320C1120,320,1040,320,960,320C880,320,800,320,720,320C640,320,560,320,480,320C400,320,320,320,240,320C160,320,80,320,40,320L0,320Z" />
      </svg>
    </div>
  </div>
</div>
